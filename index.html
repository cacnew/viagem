<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viagem 2026 · Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#060f1e;--ocean:#0d2137;--deep:#1a3a5c;--gold:#e9c46a;--white:#f0f4f8;--muted:#8ba0b8;--border:rgba(255,255,255,0.08)}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) var(--delay,0s) infinite}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.7}}

.wave-wrap{position:fixed;bottom:0;left:0;right:0;height:130px;overflow:hidden;z-index:0}
.wave-svg{width:200%;animation:waveMove 8s linear infinite}
.wave2{animation-duration:13s;animation-delay:-5s;opacity:.4}
@keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

.box{
  position:relative;z-index:1;
  background:rgba(13,33,55,0.85);
  border:1px solid var(--border);
  border-radius:1.25rem;
  padding:2.5rem 2rem;
  width:100%;max-width:380px;
  backdrop-filter:blur(16px);
  box-shadow:0 32px 80px rgba(0,0,0,.5);
  text-align:center;
}

.logo{font-size:2.5rem;margin-bottom:.75rem}
.eyebrow{font-size:.65rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.title{font-family:'Playfair Display',serif;font-size:1.75rem;margin-bottom:.25rem}
.flags{font-size:1.2rem;letter-spacing:.2rem;margin-bottom:2rem;color:var(--muted)}

.field{margin-bottom:1rem;text-align:left}
.field label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.4rem}
.field input{
  width:100%;padding:.75rem 1rem;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:.5rem;
  color:var(--white);
  font-family:'Inter',sans-serif;
  font-size:.9rem;
  outline:none;
  transition:border-color .2s;
}
.field input:focus{border-color:rgba(233,196,106,.4)}

.btn{
  width:100%;padding:.85rem;margin-top:.5rem;
  background:linear-gradient(135deg,#c9a227,var(--gold));
  border:none;border-radius:.5rem;
  color:#060f1e;font-family:'Inter',sans-serif;
  font-size:.9rem;font-weight:700;
  cursor:pointer;letter-spacing:.05em;
  transition:opacity .2s,transform .1s;
}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}

.error{
  display:none;margin-top:1rem;padding:.6rem .875rem;
  background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.3);
  border-radius:.4rem;font-size:.8rem;color:#ff9999;
}
.error.show{display:block}

.footer-note{margin-top:1.5rem;font-size:.7rem;color:var(--muted)}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="box">
  <div class="logo">⚓</div>
  <p class="eyebrow">Área restrita</p>
  <h1 class="title">Viagem 2026</h1>
  <p class="flags">🇮🇹 🇬🇷 🇹🇷</p>

  <form id="form" onsubmit="login(event)">
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="user" autocomplete="username" placeholder="login" autofocus>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="pass" autocomplete="current-password" placeholder="••••••">
    </div>
    <button class="btn" type="submit">Entrar</button>
    <div class="error" id="err">Usuário ou senha incorretos.</div>
  </form>

  <p class="footer-note">Carlos · Lívia · Ademar · Rosilaine</p>
</div>

<div class="wave-wrap">
  <svg class="wave-svg" viewBox="0 0 1440 120" preserveAspectRatio="none" fill="rgba(13,33,55,0.9)">
    <path d="M0,60 C180,120 360,0 540,60 C720,120 900,0 1080,60 C1260,120 1440,0 1440,60 L1440,120 L0,120 Z"/>
  </svg>
</div>
<div class="wave-wrap">
  <svg class="wave-svg wave2" viewBox="0 0 1440 120" preserveAspectRatio="none" fill="rgba(6,15,30,0.5)">
    <path d="M0,40 C200,100 400,0 600,50 C800,100 1000,10 1200,55 C1350,90 1440,30 1440,40 L1440,120 L0,120 Z"/>
  </svg>
</div>

<script>
const starsEl = document.getElementById('stars');
for (let i = 0; i < 100; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--d:${(Math.random()*4+2).toFixed(1)}s;--delay:-${(Math.random()*4).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

function login(e) {
  e.preventDefault();
  const u = document.getElementById('user').value.trim().toLowerCase();
  const p = document.getElementById('pass').value;
  if (u === 'viagem' && p === 'viagem') {
    sessionStorage.setItem('viagem_auth', 'ok');
    location.replace('/dashboard.html');
  } else {
    const err = document.getElementById('err');
    err.classList.add('show');
    document.getElementById('pass').value = '';
    document.getElementById('pass').focus();
  }
}
</script>
</body>
</html>
